apiVersion: v1
kind: ServiceAccount
metadata:
  name: ceph-prerequisite-reconciler
  namespace: opensphere-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ceph-prerequisite-reconciler
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [serviceaccounts, services, configmaps, secrets, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # The signed, digest-pinned Rook chart owns RBAC objects. Kubernetes requires
  # these explicit verbs when the chart grants permissions beyond this
  # reconciler's own rule set or binds those roles to chart service accounts.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, clusterroles]
    verbs: [escalate, bind]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [csi.ceph.io]
    resources: [cephconnections, clientprofiles, clientprofilemappings, drivers, operatorconfigs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ceph-prerequisite-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ceph-prerequisite-reconciler
subjects:
  - kind: ServiceAccount
    name: ceph-prerequisite-reconciler
    namespace: opensphere-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceph-prerequisite-reconciler
  namespace: opensphere-console
  labels: { app: ceph-prerequisite-reconciler }
spec:
  replicas: 1
  selector: { matchLabels: { app: ceph-prerequisite-reconciler } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: ceph-prerequisite-reconciler } }
    spec:
      serviceAccountName: ceph-prerequisite-reconciler
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: reconciler
          image: ghcr.io/opensphere-platform/opensphere-shell-cluster-manager@sha256:b6e97255c773b6f4e92ee401ae3d3614cadfbd88c8cca7d1af19c610d228466a
          imagePullPolicy: IfNotPresent
          command: [node, /app/ceph-prerequisite-reconciler.js]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: GITEA_PATH, value: ceph-prerequisites }
            - { name: GITEA_ORGANIZATION, value: opensphere }
            - { name: GITEA_REPOSITORY, value: platform-declarations }
            - name: GITEA_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-gitea-control-plane, key: token } }
            - name: RECONCILER_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-gitea-control-plane, key: reconciler-token } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ceph-prerequisite-reconciler
  namespace: opensphere-console
spec:
  selector: { app: ceph-prerequisite-reconciler }
  ports: [{ name: http, port: 8080, targetPort: http }]
