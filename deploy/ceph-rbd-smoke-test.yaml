apiVersion: v1
kind: Namespace
metadata:
  name: opensphere-ceph-smoke
  labels:
    opensphere.io/purpose: ceph-connection-smoke-test
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-rbd-smoke-delete
  labels:
    opensphere.io/purpose: ceph-connection-smoke-test
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: opensphere-dev
  imageFormat: "2"
  imageFeatures: layering
  mounter: rbd-nbd
  csi.storage.k8s.io/fstype: ext4
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceph-rbd-smoke
  namespace: opensphere-ceph-smoke
  labels:
    opensphere.io/purpose: ceph-connection-smoke-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd-smoke-delete
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ceph-rbd-smoke
  namespace: opensphere-ceph-smoke
  labels:
    opensphere.io/purpose: ceph-connection-smoke-test
spec:
  restartPolicy: Never
  containers:
    - name: verifier
      image: busybox:1.37.0
      command:
        - sh
        - -ceu
        - |
          marker="opensphere-ceph-smoke-$(date -u +%Y%m%dT%H%M%SZ)"
          printf '%s\n' "$marker" > /data/connection-marker
          test "$(cat /data/connection-marker)" = "$marker"
          echo "Ceph RBD read/write verification succeeded."
      volumeMounts:
        - name: ceph-rbd
          mountPath: /data
  volumes:
    - name: ceph-rbd
      persistentVolumeClaim:
        claimName: ceph-rbd-smoke
