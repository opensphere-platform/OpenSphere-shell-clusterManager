apiVersion: v1
kind: Namespace
metadata:
  name: opensphere-ceph-imports
  labels:
    opensphere.io/owner: cluster-manager
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: opensphere-ceph-verification
  labels:
    opensphere.io/owner: cluster-manager
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensphere-ceph-runtime-owner
  namespace: {{ .Release.Namespace }}
rules:
  # ConfigMap은 Cluster Manager가 실제로 소유하는 이름으로만 변경할 수 있다.
  # 이름 제한이 없으면 rook-csi-operator-image-set-configmap을 patch해
  # 전 노드 privileged CSI nodeplugin의 이미지를 교체할 수 있다(권한 승격 경로).
  # create는 RBAC에서 resourceNames로 제한할 수 없으므로 별도 규칙으로 분리한다.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, update, patch, delete]
    resourceNames:
      - opensphere-ceph-connection
      - opensphere-ceph-operation
      - rook-ceph-mon-endpoints
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  # Secret은 Helm이 릴리스 상태를 sh.helm.release.v1.<release>.v<N> 이름으로 저장하므로
  # resourceNames로 제한할 수 없다(버전 접미사가 무한). list는 cephStatus의 서비스 커버리지
  # 집계에 필요하다. 잔여 위험은 별도 admission 정책으로 통제한다.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, update, patch, delete]
    resourceNames: [opensphere-ceph-observer-egress]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensphere-ceph-runtime-owner
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensphere-ceph-runtime-owner
subjects:
  - kind: ServiceAccount
    name: opensphere-cluster-manager
    namespace: opensphere-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensphere-ceph-import-owner
  namespace: opensphere-ceph-imports
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensphere-ceph-import-owner
  namespace: opensphere-ceph-imports
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensphere-ceph-import-owner
subjects:
  - kind: ServiceAccount
    name: opensphere-cluster-manager
    namespace: opensphere-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensphere-ceph-verification-runner
  namespace: opensphere-ceph-verification
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensphere-ceph-verification-runner
  namespace: opensphere-ceph-verification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensphere-ceph-verification-runner
subjects:
  - kind: ServiceAccount
    name: opensphere-cluster-manager
    namespace: opensphere-console
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensphere-ceph-verification-default-deny
  namespace: opensphere-ceph-verification
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensphere-ceph-verification-image-reader
  namespace: opensphere-console
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensphere-ceph-verification-image-reader
  namespace: opensphere-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensphere-ceph-verification-image-reader
subjects:
  - kind: ServiceAccount
    name: opensphere-cluster-manager
    namespace: opensphere-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensphere-ceph-consumer-storage-owner
rules:
  # ⚠ cluster-scope 자원이다. Cluster Manager가 소유하는 이름은 `ceph-rbd`·`cephfs`
  # 접두사 규칙(ceph-manager.js의 MANAGED_STORAGE_CLASS_BASES)이며, RBAC의 resourceNames는
  # 접두사를 표현할 수 없고 create/list에는 적용조차 되지 않는다.
  # 따라서 이름·라벨·Secret namespace·기본 StorageClass 경계는
  # deploy/ceph-consumer-storage-admission.yaml의 ValidatingAdmissionPolicy가
  # CREATE/UPDATE/DELETE에서 강제한다(감사 H-01). 이 정책 없이 배포하면
  # 이 Role은 클러스터의 모든 StorageClass를 변조·삭제할 수 있다.
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, create, update, patch, delete]
  # 검증 PVC 삭제 후 CSI가 backing volume까지 정리했는지 확인하기 위한 읽기 전용 권한.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opensphere-ceph-consumer-storage-owner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opensphere-ceph-consumer-storage-owner
subjects:
  - kind: ServiceAccount
    name: opensphere-cluster-manager
    namespace: opensphere-console
